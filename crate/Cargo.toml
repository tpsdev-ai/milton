[package]
name = "milton"
version = "0.0.0"
edition = "2021"
license = "UNLICENSED"
description = "In-process nomic-embed-text-v1.5 embeddings for Flair (tokenizer + GGUF dequant + forward)"
publish = false
repository = "https://github.com/tpsdev-ai/milton"
rust-version = "1.83"

[lib]
name = "milton"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "milton-tokenize"
path = "src/bin/milton-tokenize.rs"
required-features = ["cli"]

[[bin]]
name = "dequant-gate"
path = "src/bin/dequant-gate.rs"

[[bin]]
name = "dequant-must-fail"
path = "src/bin/dequant-must-fail.rs"

[[bin]]
name = "dump-gguf"
path = "src/bin/dump-gguf.rs"

[[bin]]
name = "milton-embed"
path = "src/bin/milton-embed.rs"

[[bin]]
name = "embed-gate"
path = "src/bin/embed-gate.rs"

[[bin]]
name = "embed-must-fail"
path = "src/bin/embed-must-fail.rs"

[[bin]]
name = "milton-profile"
path = "src/bin/milton-profile.rs"
required-features = ["profile"]

[features]
default = []
# CLI extras for milton-tokenize. serde_json is a regular dep (dequant bins + tokenizer).
cli = []
# Test-only: compile the MILTON_ROPE_LIBM_SIN env read into native milton-embed.
# Default / shipped builds omit it (Kern #32 hazard 3 / issue #33) so a stray
# env var cannot put libm sin/cos on the native path. Enable only for the
# wasm:compare must-fire receipt. Not `must-fail` — that name is already the
# ForwardFault family (embed-must-fail / wasm:must-fail / dequant-must-fail).
rope-libm-sin = []
# Harness-only stage timers (issue #28). Default / shipped / wasm:build omit this
# so the default wasm stays bit-identical. Do not enable on the embed path.
profile = []
# Threaded wasm artifact only (`scripts/build-wasm.sh` second pass).
# Default / single-thread `wasm/milton_bg.wasm` must not enable this —
# a shared-memory module cannot instantiate where SAB is absent.
wasm-threads = []
# Relaxed-SIMD Q4_K / Q5_K integer trees. Second single-thread artifact
# only (`wasm/milton_relaxed_bg.wasm`). Default / simd128 / threads
# builds omit this so bun can still instantiate `milton_bg.wasm`.
# Do not enable as a global `+relaxed-simd` RUSTFLAG — LLVM must not
# rewrite the f32 scale stage.
relaxed-simd = []

[dependencies]
unicode-general-category = "1.0"
unicode-normalization = "0.1.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# WASM-SIMD packaging only. Native bins do not link this.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.100"

[dev-dependencies]
serde_json = "1"
